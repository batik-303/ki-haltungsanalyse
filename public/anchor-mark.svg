<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150" role="img" aria-label="Blue Anchor Music">
  <!-- Favicon-Fassung der Blue-Anchor-Marke (#48, Variante „Aufwärts"): gerader
       senkrechter Steg + leuchtender Ankerpunkt. Dickerer Steg, kleinerer
       Glow-Blur, kein Glanzlicht — Werte gespiegelt aus computeAnchorMarkGeometry(≤32). -->
  <defs>
    <radialGradient id="dot" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="112" r="30" fill="rgba(56,189,248,0.4)" filter="url(#glow)"/>
  <line x1="60" y1="22" x2="60" y2="94" stroke="#0284c7" stroke-width="11" stroke-linecap="round"/>
  <circle cx="60" cy="112" r="22" fill="url(#dot)"/>
</svg>
